spring.application.name=employee
server.port=8080

# 1. Database Connection URL
spring.datasource.url=jdbc:sqlserver://employee-server.database.windows.net:1433;database=EmployeeDB;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Native Azure Key Vault Secret Placeholders
# This maps the Key Vault secret values directly to the Spring properties
spring.datasource.username=${datasource-username}
spring.datasource.password=${spring-datasource-password}

# 3. Azure Key Vault Settings (Enabled for Runtime Deployment)
spring.cloud.azure.keyvault.secret.property-sources.enabled=true
spring.cloud.azure.keyvault.secret.property-sources.endpoint=https://empkey62vault.vault.azure.net/

# Custom placeholders for your fallback/test setup strings
azure.keyvault.url=https://empkey62vault.vault.azure.net/
azure.keyvault.secret.db-username=datasource-username
azure.keyvault.secret.db-password=spring-datasource-password

# 4. JPA / Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# 5. Kafka Configuration (Referencing Key Vault Safely)
spring.kafka.bootstrap-servers=employee-kafka-ns.servicebus.windows.net:9093
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN

# This resolves Kafka authentication safely using your imported Key Vault password placeholder
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${spring-datasource-password}";

# 6. Mail Configuration
