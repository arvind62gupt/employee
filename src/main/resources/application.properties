spring.application.name=employee
server.port=8080

# ===================================================================
# 1. Database Connection Configuration
# ===================================================================
spring.datasource.url=jdbc:sqlserver://employee-server.database.windows.net:1433;database=EmployeeDB;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# 2. Azure Key Vault Settings
# ===================================================================
# Keeps Spring Cloud Azure enabled for auto-property sourcing if used elsewhere
spring.cloud.azure.keyvault.secret.property-sources.enabled=true

# Custom mapping placeholders read by your Java custom @Configuration classes
azure.keyvault.url=https://empkey62vault.vault.azure.net/
azure.keyvault.secret.db-username=datasource-username
azure.keyvault.secret.db-password=spring-datasource-password

# ? These variables point to your two dedicated, pre-formatted JAAS strings inside your Key Vault
azure.keyvault.secret.kafka-producer-jaas=kafka-producer-jaas
azure.keyvault.secret.kafka-consumer-jaas=kafka-consumer-jaas

# ===================================================================
# 3. JPA / Hibernate Configuration
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# ===================================================================
# 4. Basic Kafka Metadata Configuration
# ===================================================================
spring.kafka.bootstrap-servers=employee-kafka-ns.servicebus.windows.net:9093
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# CRITICAL FIX: Removed 'spring.kafka.properties.sasl.jaas.config' entirely.
# Your Java configuration classes handle injecting this value dynamically at runtime.
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN

# ===================================================================
# 5. Mail Configuration
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
