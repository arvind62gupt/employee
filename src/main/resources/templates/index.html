<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div th:if="${successMessage}">
    <script th:inline="javascript">
        alert([[${successMessage}]]);
    </script>
</div>

<div th:if="${successMessage}"
     class="toast-container position-fixed top-0 end-0 p-3">

    <div id="successToast"
         class="toast text-bg-success border-0"
         role="alert">

        <div class="d-flex">
            <div class="toast-body">
                ✅ <span th:text="${successMessage}"></span>
            </div>

            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>
        </div>

    </div>
</div>
<script th:if="${successMessage}">
    document.addEventListener("DOMContentLoaded", function () {
        var toastEl = document.getElementById('successToast');
        var toast = new bootstrap.Toast(toastEl, {
            delay: 3000
        });
        toast.show();
    });
</script>

<div th:if="${errorMessage}">
    <script th:inline="javascript">
        alert([[${errorMessage}]]);
    </script>
</div>
<body class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Employee List</h2>
    <a th:href="@{/employees/showNewEmployeeForm}" class="btn btn-primary btn-sm">Add Employee</a>
</div>

<table class="table table-striped table-bordered">
    <thead style="background-color:#0d6efd; color:white;">
    <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${listEmployees}">
        <td th:text="${employee.firstName}"></td>
        <td th:text="${employee.lastName}"></td>
        <td th:text="${employee.email}"></td>
        <td>
            <a th:href="@{/employees/showFormForUpdate/{id}(id=${employee.id})}" class="btn btn-warning btn-sm">Update</a>
            <a th:href="@{/employees/deleteEmployee/{id}(id=${employee.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
