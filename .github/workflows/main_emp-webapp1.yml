name: Build and deploy JAR app to Azure Web App - emp-webapp1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests # 👈 Changed 'install' to 'package' and skipped tests for speed

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'target/*.jar' # 👈 Fixed: Removed github.workspace wrapper for cleaner mapping

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: target # 👈 Fixed: Stripped leading dot/slash for absolute alignment

      - name: Login to Azure using Secret Bundle
        uses: azure/login@v2 # 👈 Fixed: Downgraded to v2 because v3 has known service principal bugs on Windows
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'emp-webapp1'
          slot-name: 'Production'
          package: 'target/*.jar' # 👈 Fixed: Removed leading dot-slash to resolve Windows runner lookups
